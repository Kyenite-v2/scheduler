name: Send Daily Appointment Reminders

on:
  schedule:
    # Runs every day at 8:00 AM Philippines time (00:00 UTC)
    - cron: "0 0 * * *"

  # Optional: allow manual run from GitHub
  workflow_dispatch:

jobs:
  trigger-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: Call Reminder API
        run: |
          curl -X GET "https://appointment-scheduler-topaz.vercel.app/api/v1/verify/sendReminder?secret=${{ secrets.CRON_SECRET }}"
